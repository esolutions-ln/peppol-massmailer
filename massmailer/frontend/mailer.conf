server {
    listen 80;
    server_name _;
    client_max_body_size 200m;

    location = /favicon.ico {
        log_not_found off;
        access_log off;
        return 204;
    }

    # ── Backend proxy ──────────────────────────────────────────────────────
    # The SPA calls the API same-origin (client.ts: BASE = '/api/v1'), so these
    # prefixes MUST reach the backend. Without them the `location /` SPA
    # fallback below answers every API call with index.html and a 200, and the
    # UI fails in ways that look like data bugs rather than routing bugs.
    location ~ ^/(api|peppol|webhooks|actuator|v3/api-docs|swagger-ui) {
        proxy_pass http://mass-mailer:9199;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Large PDF uploads and slow batch sends need generous timeouts.
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_request_buffering off;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
